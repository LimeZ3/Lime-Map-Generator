[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapgen"
version = "0.1.0"
description = "Windows-first ML experiments for Supreme Commander: Forged Alliance map generation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
  { name = "MapGen Contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]
ml = [
  # Install PyTorch with the CUDA index URL from the README for the local GPU/CUDA target.
  "numpy>=1.26",
  "pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
